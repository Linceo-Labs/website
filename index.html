<style>
  :root{
    --bg:#02050a;
    --ink:#e8f1fb;
    --muted:#8ea3b8;
    --blue:#4fa8e8;
    --line:rgba(79,168,232,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  /* estrellas */
  .sky{position:fixed;inset:0;pointer-events:none;
    background-image:
      radial-gradient(1px 1px at 12% 18%,rgba(255,255,255,.55) 50%,transparent 51%),
      radial-gradient(1px 1px at 27% 72%,rgba(255,255,255,.35) 50%,transparent 51%),
      radial-gradient(1.5px 1.5px at 41% 33%,rgba(160,210,255,.6) 50%,transparent 51%),
      radial-gradient(1px 1px at 63% 12%,rgba(255,255,255,.4) 50%,transparent 51%),
      radial-gradient(1px 1px at 78% 58%,rgba(255,255,255,.45) 50%,transparent 51%),
      radial-gradient(1.5px 1.5px at 88% 26%,rgba(160,210,255,.5) 50%,transparent 51%),
      radial-gradient(1px 1px at 55% 88%,rgba(255,255,255,.3) 50%,transparent 51%),
      radial-gradient(1px 1px at 7% 52%,rgba(255,255,255,.35) 50%,transparent 51%),
      radial-gradient(1px 1px at 93% 82%,rgba(255,255,255,.3) 50%,transparent 51%),
      radial-gradient(1px 1px at 34% 8%,rgba(255,255,255,.3) 50%,transparent 51%);
  }
  .glow{position:fixed;left:50%;top:42%;width:120vmax;height:120vmax;transform:translate(-50%,-50%);
    background:radial-gradient(closest-side,rgba(40,110,190,.18),rgba(40,110,190,.05) 45%,transparent 70%);
    pointer-events:none}
  /* orbita animada */
  .orbit{position:fixed;left:50%;top:42%;width:min(92vw,820px);aspect-ratio:1;transform:translate(-50%,-50%);
    border:1px solid var(--line);border-radius:50%;pointer-events:none}
  .orbit::after{content:"";position:absolute;top:50%;left:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;
    background:var(--blue);box-shadow:0 0 14px 4px rgba(79,168,232,.6);
    transform:rotate(0deg) translateX(calc(min(92vw,820px)/2)) ;animation:spin 38s linear infinite}
  @keyframes spin{to{transform:rotate(360deg) translateX(calc(min(92vw,820px)/2))}}

  main{position:relative;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:48px 16px 96px;text-align:center}
  .logo{width:min(560px,86vw);height:auto;display:block;margin-bottom:40px;
    filter:drop-shadow(0 0 24px rgba(79,168,232,.18))}
  .tag{font-size:12px;letter-spacing:.42em;text-transform:uppercase;color:var(--blue);margin-bottom:18px}
  h1{font-size:clamp(30px,5.2vw,52px);font-weight:600;letter-spacing:-.01em;line-height:1.1;margin-bottom:18px}
  p.lead{max-width:600px;font-size:clamp(15px,2vw,18px);line-height:1.6;color:var(--muted);margin-bottom:36px}
  .cta{display:inline-flex;align-items:center;gap:10px;padding:13px 22px;border:1px solid rgba(79,168,232,.45);
    border-radius:999px;color:var(--ink);text-decoration:none;font-size:15px;letter-spacing:.02em;
    transition:background .2s,border-color .2s}
  .cta:hover{background:rgba(79,168,232,.12);border-color:var(--blue)}
  .cta svg{width:16px;height:16px}
  footer{position:absolute;bottom:22px;left:0;right:0;text-align:center;font-size:12px;color:#5a6b7d;letter-spacing:.06em}
  @media (prefers-reduced-motion:reduce){.orbit::after{animation:none}}
</style>
</head>
